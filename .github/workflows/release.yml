name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("manifest.json").read_text())["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match manifest.json version")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if not section or not section.group(1).strip():
              raise SystemExit("Missing release notes in CHANGELOG.md")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              section.group(1).strip() + "\n", encoding="utf-8"
          )
          PY

      - name: Build extension ZIP
        run: python3 scripts/build-release.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/LaterOn-${VERSION}.zip" \
            --verify-tag \
            --title "LaterOn ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
