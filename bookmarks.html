<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>LaterOn · 书签库</title>
  <link rel="icon" href="icon128.png" />
  <link rel="stylesheet" href="theme-vars.css" />
  <link rel="stylesheet" href="dialog.css" />
  <link rel="stylesheet" href="bookmarks.css" />
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="dialog.js"></script>
  <script src="bookmarks.js" defer></script>
</head>
<body>
  <header class="bookmark-header">
    <a class="bookmark-brand" href="library.html"><img src="icon128.png" width="36" height="36" alt="" />LaterOn</a>
    <nav aria-label="Libraries"><a href="library.html" data-bm="reading">临时阅读</a><a href="bookmarks.html" aria-current="page" data-bm="name">书签库</a></nav>
    <a href="settings.html" data-bm="settings">设置</a>
  </header>
  <main class="bookmark-shell">
    <section class="bookmark-intro">
      <p class="bookmark-eyebrow" data-bm="eyebrow">长期收藏 · 浏览器双向同步</p>
      <h1 data-bm="name">书签库</h1>
      <p data-bm="intro">与浏览器书签保持一致的长期收藏，独立于临时阅读，不受已读自动清除影响。</p>
    </section>
    <section class="bookmark-sync" aria-labelledby="syncTitle">
      <div class="sync-copy"><h2 id="syncTitle" data-bm="syncTitle">浏览器书签双向同步</h2><p data-bm="syncHint">默认同步全部书签，也可以只选择一个文件夹及其子文件夹。停用或修改范围不会删除浏览器书签。</p></div>
      <div class="sync-controls">
        <button id="bookmarkEnable" type="button" class="primary" data-bm="enable">启用并授权</button>
        <button id="bookmarkDisable" type="button" data-bm="disable" hidden>停用同步</button>
        <label for="bookmarkScope" data-bm="scope">同步范围</label>
        <select id="bookmarkScope"><option value="" data-bm="all">全部书签</option></select>
        <button id="bookmarkApplyScope" type="button" data-bm="applyScope">应用范围</button>
        <button id="bookmarkRefresh" type="button" data-bm="refresh">刷新</button>
      </div>
      <p id="bookmarkStatus" class="bookmark-status" role="status" aria-live="polite"></p>
    </section>
    <section id="bookmarkTransfer" class="bookmark-transfer" hidden aria-labelledby="transferTitle">
      <h2 id="transferTitle" data-bm="transfer">从临时阅读存入书签库</h2>
      <p id="bookmarkTransferSummary"></p>
      <p data-bm="transferHint">转存会保留临时阅读中的原件，日后清除原件也不会删除书签。</p>
      <label for="bookmarkTransferFolder" data-bm="destination">目标文件夹</label>
      <select id="bookmarkTransferFolder" class="folder-destination"></select>
      <button id="bookmarkCopy" class="primary" type="button" data-bm="copy">确认转存</button>
      <p id="bookmarkTransferResult" role="status" aria-live="polite"></p>
    </section>
    <div class="bookmark-workspace">
      <aside class="bookmark-sidebar" aria-label="Bookmark folders">
        <h2 data-bm="folders">文件夹</h2>
        <div id="bookmarkFolders"></div>
      </aside>
      <section class="bookmark-content" aria-labelledby="bookmarkViewTitle">
        <div class="bookmark-toolbar"><h2 id="bookmarkViewTitle" data-bm="all">全部书签</h2><span id="bookmarkCount"></span>
          <label class="bookmark-search"><span data-bm="search">搜索书签</span><input id="bookmarkSearch" type="search" autocomplete="off" /></label>
        </div>
        <details id="bookmarkAddPanel" class="bookmark-add">
          <summary data-bm="add">添加网页或文件夹</summary>
          <form id="bookmarkAddForm">
            <label for="bookmarkTitle" data-bm="title">名称</label><input id="bookmarkTitle" required maxlength="500" />
            <label for="bookmarkUrl" data-bm="url">网页地址</label><input id="bookmarkUrl" type="url" placeholder="https://example.com" />
            <p data-bm="folderHint">地址留空时新建文件夹；填写地址时添加网页。</p>
            <label for="bookmarkParent" data-bm="destination">目标文件夹</label><select id="bookmarkParent" class="folder-destination" required></select>
            <button class="primary" type="submit" data-bm="addAction">添加</button>
          </form>
        </details>
        <div id="bookmarkFolderActions" class="folder-actions" hidden><button id="bookmarkRenameFolder" type="button" data-bm="renameFolder">重命名文件夹</button><button id="bookmarkRemoveFolder" type="button" class="danger" data-bm="removeFolder">删除空文件夹</button></div>
        <form id="bookmarkMoveForm" class="bookmark-transfer" hidden>
          <h2 id="bookmarkMoveTitle"></h2>
          <label for="bookmarkMoveFolder" data-bm="destination">目标文件夹</label><select id="bookmarkMoveFolder" class="folder-destination"></select>
          <button type="submit" class="primary" data-bm="move">移动</button><button id="bookmarkMoveCancel" type="button" data-bm="cancel">取消</button>
        </form>
        <p id="bookmarkEmpty" class="bookmark-empty" data-bm="empty">这里还没有书签。</p>
        <div id="bookmarkList" class="bookmark-list"></div>
      </section>
    </div>
    <p class="bookmark-footnote" data-bm="privacy">书签修改直接作用于当前浏览器。此区域不参与临时阅读的清空、JSON 备份或 WebDAV 同步；跨设备书签同步由浏览器负责。</p>
  </main>
</body>
</html>
